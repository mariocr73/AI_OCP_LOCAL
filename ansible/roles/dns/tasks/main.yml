---
# ===========================================================
# Role: dns - Configure dnsmasq DNS service
# ===========================================================
# Deploys the dnsmasq configuration with DNS zones (A, PTR,
# SRV records) and DHCP sections from the shared template.
# The single dnsmasq.conf.j2 template handles both DNS and
# DHCP; this role focuses on DNS-related validation.
# ===========================================================

# ---- Deploy dnsmasq configuration ----
- name: Deploy dnsmasq configuration
  ansible.builtin.template:
    src: dnsmasq.conf.j2
    dest: /etc/dnsmasq.conf
    owner: root
    group: root
    mode: '0644'
    backup: true
    validate: "dnsmasq --test -C %s"
  notify: Restart dnsmasq

- name: Ensure dnsmasq log file exists
  ansible.builtin.file:
    path: /var/log/dnsmasq.log
    state: touch
    owner: root
    group: root
    mode: '0644'
    modification_time: preserve
    access_time: preserve

# ---- Disable systemd-resolved if running (conflicts with dnsmasq) ----
- name: Check if systemd-resolved is active
  ansible.builtin.command:
    cmd: systemctl is-active systemd-resolved
  register: _resolved_status
  changed_when: false
  failed_when: false

- name: Stop and disable systemd-resolved (conflicts with dnsmasq on port 53)
  ansible.builtin.systemd:
    name: systemd-resolved
    state: stopped
    enabled: false
  when: _resolved_status.stdout == 'active'

- name: Configure /etc/resolv.conf to use local dnsmasq
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      # Managed by Ansible - points to local dnsmasq
      nameserver 127.0.0.1
      search {{ cluster_name }}.{{ base_domain }}
    owner: root
    group: root
    mode: '0644'

# ---- Ensure dnsmasq waits for network on boot ----
# dnsmasq can start before the NIC has its IP assigned, causing it
# to fail binding to listen-address (e.g. 192.168.122.5). This
# systemd override ensures it waits for network-online.target.
- name: Create dnsmasq systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/dnsmasq.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy dnsmasq systemd override (wait for network)
  ansible.builtin.copy:
    dest: /etc/systemd/system/dnsmasq.service.d/wait-for-network.conf
    content: |
      [Unit]
      After=network-online.target
      Wants=network-online.target
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd
    - Restart dnsmasq

# ---- Enable and start dnsmasq ----
- name: Enable and start dnsmasq
  ansible.builtin.systemd:
    name: dnsmasq
    state: started
    enabled: true
