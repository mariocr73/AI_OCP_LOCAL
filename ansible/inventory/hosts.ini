# ===========================================================
# OCP 4.20 Compact Cluster - Ansible Inventory
# ===========================================================
# Edit IPs and ansible_user to match your environment.
# Masters are listed for reference/post-install; they are NOT
# managed by Ansible during deployment (Assisted Installer
# handles provisioning via Discovery ISO).
# ===========================================================

[bastion]
bastion ansible_host=192.168.122.5

[masters]
master-0 ansible_host=192.168.122.101
master-1 ansible_host=192.168.122.102
master-2 ansible_host=192.168.122.103

[ocp:children]
masters

[bastion:vars]
ansible_user=root
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=~/.ssh/ed25519

[masters:vars]
ansible_user=core
ansible_python_interpreter=/usr/bin/python3
